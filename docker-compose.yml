version: "3.9"

services:

  db:
    image: postgres:17

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: family_budget

    ports:
      - "5432:5432"

  bot:

    build: .

    depends_on:
      - db

    env_file:
      - .env